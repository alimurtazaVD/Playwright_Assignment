[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: mark test as smoke test
    regression: mark test as regression test
    flaky: mark test as potentially flaky
    cross_browser: mark test to run on multiple browsers in parallel

# Output and reporting
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=reports/report.html
    --self-contained-html
    --metadata Environment ENV
    --metadata Browser browser
    --metadata BaseURL base_url

# Test execution
minversion = 7.0
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# BDD Configuration
bdd_features_base_dir = tests/automation_store/features

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html:reports/coverage --cov-report=term-missing
